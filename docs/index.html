<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calyth — AI Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b; --bg2: #18181b; --bg3: #27272a; --bg4: #3f3f46;
            --fg: #fafafa; --fg2: #a1a1aa; --fg3: #71717a;
            --border: #27272a; --accent: #6366f1; --accent2: #818cf8;
            --glow: rgba(99,102,241,0.12); --green: #22c55e; --red: #ef4444;
            --r: 12px; --font: 'Inter',-apple-system,sans-serif; --mono: 'JetBrains Mono',monospace;
        }
        .light { --bg: #f8fafc; --bg2: #fff; --bg3: #f1f5f9; --bg4: #e2e8f0; --fg: #0f172a; --fg2: #475569; --fg3: #94a3b8; --border: #e2e8f0; --glow: rgba(99,102,241,0.06); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--fg); height:100vh; display:flex; overflow:hidden; }

        /* Sidebar */
        .sidebar { width:260px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:width .25s,opacity .25s; z-index:10; flex-shrink:0; }
        .sidebar.collapsed { width:0; opacity:0; overflow:hidden; border:none; }
        .sb-head { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
        .sb-head .logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; }
        .sb-head .logo span { background:linear-gradient(135deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .sb-close { background:none; border:none; color:var(--fg3); cursor:pointer; padding:4px; border-radius:6px; display:flex; }
        .sb-close:hover { background:var(--bg3); }
        .sb-body { flex:1; overflow-y:auto; padding:8px; }
        .new-chat { margin:8px; padding:10px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--r); color:var(--fg); font-size:13px; font-weight:500; cursor:pointer; font-family:var(--font); width:calc(100% - 16px); transition:all .15s; }
        .new-chat:hover { background:var(--bg4); }
        .sb-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--fg3); padding:12px 12px 4px; }
        .chat-item { padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--fg2); display:flex; align-items:center; gap:8px; margin:1px 0; transition:all .12s; position:relative; }
        .chat-item:hover { background:var(--bg3); color:var(--fg); }
        .chat-item.active { background:var(--glow); color:var(--accent2); }
        .chat-item .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .chat-item .acts { display:none; gap:2px; }
        .chat-item:hover .acts { display:flex; }
        .act-btn { background:none; border:none; color:var(--fg3); cursor:pointer; padding:2px 4px; border-radius:4px; font-size:11px; }
        .act-btn:hover { color:var(--fg); background:var(--bg4); }
        .act-btn.del:hover { color:var(--red); }
        .sb-foot { padding:8px; border-top:1px solid var(--border); }
        .srv-status { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; background:var(--bg3); font-size:12px; color:var(--fg2); cursor:pointer; }
        .srv-status:hover { background:var(--bg4); }
        .dot { width:7px; height:7px; border-radius:50%; background:var(--fg3); flex-shrink:0; }
        .dot.ok { background:var(--green); box-shadow:0 0 6px rgba(34,197,94,.5); }
        .dot.err { background:var(--red); }

        /* Main */
        .main { flex:1; display:flex; flex-direction:column; min-width:0; }
        .topbar { padding:10px 20px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
        .menu-btn { background:none; border:none; color:var(--fg2); cursor:pointer; padding:6px; border-radius:8px; display:flex; }
        .menu-btn:hover { background:var(--bg3); color:var(--fg); }
        .model-sel { background:var(--bg3); color:var(--fg); border:1px solid var(--border); padding:7px 12px; border-radius:8px; font-size:13px; font-family:var(--font); cursor:pointer; outline:none; min-width:180px; }
        .model-sel:focus { border-color:var(--accent); }
        .tb-right { margin-left:auto; display:flex; gap:6px; align-items:center; }
        .ib { background:var(--bg3); border:1px solid var(--border); color:var(--fg2); width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .12s; }
        .ib:hover { background:var(--bg4); color:var(--fg); }
        .ib.on { background:var(--accent); color:#fff; border-color:var(--accent); }
        .ib svg { width:16px; height:16px; }

        /* Search */
        .search-bar { display:none; padding:10px 20px; background:var(--bg2); border-bottom:1px solid var(--border); gap:8px; align-items:center; }
        .search-bar.open { display:flex; }
        .search-bar input { flex:1; background:var(--bg3); border:1px solid var(--border); color:var(--fg); padding:8px 12px; border-radius:8px; font-size:13px; font-family:var(--font); outline:none; }
        .search-bar input:focus { border-color:var(--accent); }
        .search-bar .cnt { font-size:12px; color:var(--fg3); white-space:nowrap; }

        /* Chat area */
        .chat { flex:1; overflow-y:auto; padding:20px; scroll-behavior:smooth; }
        .chat::-webkit-scrollbar { width:5px; }
        .chat::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:3px; }
        .welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:12px; }
        .w-icon { width:64px; height:64px; background:linear-gradient(135deg,#6366f1,#a855f7); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 8px 24px rgba(99,102,241,.3); }
        .welcome h2 { font-size:24px; font-weight:600; background:linear-gradient(135deg,var(--fg),var(--fg2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .welcome p { color:var(--fg3); font-size:14px; max-width:360px; }
        .qk { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
        .qk-btn { padding:7px 12px; background:var(--bg3); border:1px solid var(--border); border-radius:20px; font-size:12px; color:var(--fg2); cursor:pointer; font-family:var(--font); transition:all .12s; }
        .qk-btn:hover { background:var(--bg4); color:var(--fg); }

        /* Messages */
        .msg { display:flex; gap:10px; max-width:720px; margin:0 auto 20px; animation:fadeUp .3s ease; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } }
        .av { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; margin-top:2px; }
        .av.user { background:linear-gradient(135deg,#6366f1,#818cf8); color:#fff; }
        .av.bot { background:var(--bg3); color:var(--fg2); }
        .av.err { background:#450a0a; color:#fca5a5; }
        .mc { flex:1; min-width:0; }
        .mh { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
        .mn { font-size:13px; font-weight:600; }
        .mt { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:500; }
        .mt.groq { background:rgba(99,102,241,.12); color:#818cf8; }
        .mt.google { background:rgba(34,197,94,.12); color:#4ade80; }
        .mtime { font-size:11px; color:var(--fg3); }

        /* Markdown */
        .mb { font-size:14px; line-height:1.7; color:var(--fg2); }
        .mb strong { color:var(--fg); font-weight:600; }
        .mb a { color:var(--accent2); }
        .mb code { background:var(--bg3); padding:2px 5px; border-radius:4px; font-size:13px; font-family:var(--mono); }
        .mb h1 { font-size:20px; font-weight:700; color:var(--fg); margin:12px 0 6px; }
        .mb h2 { font-size:17px; font-weight:600; color:var(--fg); margin:10px 0 5px; }
        .mb h3 { font-size:15px; font-weight:600; color:var(--fg); margin:8px 0 4px; }
        .mb ul,.mb ol { padding-left:20px; margin:6px 0; }
        .mb li { margin:3px 0; }
        .mb li::marker { color:var(--accent); }
        .mb blockquote { border-left:3px solid var(--accent); padding:6px 12px; margin:10px 0; background:var(--glow); border-radius:0 8px 8px 0; font-style:italic; }
        .mb table { border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
        .mb th,.mb td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
        .mb th { background:var(--bg3); font-weight:600; }
        .mb hr { border:none; border-top:1px solid var(--border); margin:14px 0; }
        .mb pre { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:14px; overflow-x:auto; margin:10px 0; position:relative; }
        .mb pre code { background:none; padding:0; font-size:13px; color:#e6edf3; }
        .code-hdr { display:flex; justify-content:space-between; align-items:center; padding:5px 14px; background:#161b22; border:1px solid var(--border); border-bottom:none; border-radius:8px 8px 0 0; font-size:12px; color:var(--fg3); }
        .code-hdr + pre { border-radius:0 0 8px 8px; margin-top:0; }
        .cp-btn { background:var(--bg3); border:1px solid var(--border); color:var(--fg3); padding:3px 7px; border-radius:5px; font-size:11px; cursor:pointer; font-family:var(--font); }
        .cp-btn:hover { background:var(--bg4); color:var(--fg); }

        .msg-acts { display:flex; gap:3px; margin-top:4px; opacity:0; transition:opacity .12s; }
        .msg:hover .msg-acts { opacity:1; }
        .ma { background:none; border:1px solid transparent; color:var(--fg3); padding:3px 7px; border-radius:5px; font-size:11px; cursor:pointer; font-family:var(--font); transition:all .12s; display:flex; align-items:center; gap:3px; }
        .ma:hover { background:var(--bg3); color:var(--fg); border-color:var(--border); }
        .edit-box { background:var(--bg3); border:1px solid var(--accent); border-radius:8px; padding:8px; margin-top:6px; display:none; }
        .edit-box.on { display:block; }
        .edit-box textarea { width:100%; background:transparent; color:var(--fg); border:none; outline:none; font-size:13px; font-family:var(--font); resize:vertical; min-height:50px; }
        .edit-acts { display:flex; gap:5px; justify-content:flex-end; margin-top:4px; }

        /* Typing */
        .dots { display:inline-flex; gap:3px; padding:4px 0; }
        .dots span { width:5px; height:5px; background:var(--accent); border-radius:50%; animation:bounce 1.4s infinite ease-in-out; }
        .dots span:nth-child(2) { animation-delay:.16s; }
        .dots span:nth-child(3) { animation-delay:.32s; }
        @keyframes bounce { 0%,80%,100% { transform:scale(.3); opacity:.3; } 40% { transform:scale(1); opacity:1; } }

        /* Input */
        .inp-wrap { padding:0 20px 20px; max-width:720px; margin:0 auto; width:100%; }
        .inp-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); display:flex; align-items:flex-end; gap:6px; padding:10px; transition:border-color .2s; }
        .inp-box:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
        .inp-box textarea { flex:1; background:transparent; color:var(--fg); border:none; outline:none; font-size:14px; font-family:var(--font); resize:none; max-height:100px; line-height:1.5; padding:4px 0; }
        .inp-box textarea::placeholder { color:var(--fg3); }
        .inp-extras { display:flex; gap:2px; padding-bottom:2px; }
        .inp-extras .ib { width:30px; height:30px; border:none; font-size:14px; }
        .send { width:34px; height:34px; background:var(--accent); border:none; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all .12s; }
        .send:hover { background:var(--accent2); transform:scale(1.05); }
        .send:disabled { background:var(--bg3); cursor:not-allowed; transform:none; }
        .send svg { width:16px; height:16px; }
        .inp-hint { text-align:center; font-size:11px; color:var(--fg3); margin-top:6px; }

        /* File preview */
        .fp { display:none; padding:6px 0; gap:6px; flex-wrap:wrap; }
        .fp.on { display:flex; }
        .ft { position:relative; width:52px; height:52px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
        .ft img { width:100%; height:100%; object-fit:cover; }
        .ft .x { position:absolute; top:1px; right:1px; background:rgba(0,0,0,.7); border:none; color:#fff; width:14px; height:14px; border-radius:50%; cursor:pointer; font-size:9px; display:flex; align-items:center; justify-content:center; }

        /* Stop */
        .stop { display:none; margin:0 auto 12px; padding:7px 16px; background:var(--bg3); border:1px solid var(--border); border-radius:20px; color:var(--fg2); font-size:13px; cursor:pointer; font-family:var(--font); align-items:center; gap:5px; }
        .stop.on { display:flex; }
        .stop:hover { background:var(--bg4); }

        /* Shortcuts */
        .sc-bar { display:flex; gap:10px; justify-content:center; padding:6px; font-size:11px; color:var(--fg3); }
        .sc-bar kbd { background:var(--bg3); border:1px solid var(--border); padding:1px 4px; border-radius:3px; font-family:var(--font); font-size:10px; }

        /* Modal */
        .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); z-index:20; align-items:center; justify-content:center; }
        .modal-bg.on { display:flex; }
        .modal { background:var(--bg2); border:1px solid var(--border); border-radius:var(--r); padding:20px; width:90%; max-width:400px; animation:mIn .2s ease; }
        @keyframes mIn { from { opacity:0; transform:scale(.96); } }
        .modal h3 { font-size:15px; font-weight:600; margin-bottom:14px; }
        .mf { margin-bottom:12px; }
        .mf label { display:block; font-size:12px; font-weight:500; color:var(--fg2); margin-bottom:5px; }
        .mf input,.mf textarea { width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--fg); padding:9px 10px; border-radius:8px; font-size:13px; font-family:var(--font); outline:none; }
        .mf textarea { resize:vertical; min-height:70px; }
        .mf input:focus,.mf textarea:focus { border-color:var(--accent); }
        .m-acts { display:flex; gap:6px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
        .btn { padding:7px 14px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; font-family:var(--font); border:1px solid var(--border); transition:all .12s; }
        .btn2 { background:var(--bg3); color:var(--fg); }
        .btn2:hover { background:var(--bg4); }
        .btn1 { background:var(--accent); color:#fff; border-color:var(--accent); }
        .btn1:hover { background:var(--accent2); }
        .btn-d { background:#450a0a; color:#fca5a5; border-color:#7f1d1d; }
        .btn-d:hover { background:#7f1d1d; }
        .share-link { background:var(--bg3); border:1px solid var(--border); padding:7px 10px; border-radius:8px; font-size:13px; font-family:var(--mono); word-break:break-all; }

        @media(max-width:768px) {
            .sidebar { position:fixed; top:0; left:0; bottom:0; width:260px; transform:translateX(-100%); transition:transform .25s; }
            .sidebar.open { transform:translateX(0); }
            .sidebar.collapsed { transform:translateX(-100%); }
            .chat { padding:12px; }
            .inp-wrap { padding:0 12px 12px; }
            .topbar { padding:10px 12px; }
            .sc-bar { display:none; }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sb-head">
            <div class="logo"><span>Calyth</span></div>
            <button class="sb-close" onclick="toggleSidebar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        </div>
        <div class="sb-body">
            <button class="new-chat" onclick="newChat()">+ New Chat</button>
            <div class="sb-label">Recent</div>
            <div id="chatList"></div>
        </div>
        <div class="sb-foot">
            <div class="srv-status" onclick="openSettings()"><div class="dot" id="sDot"></div><span id="sTxt">Not connected</span></div>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
            <select class="model-sel" id="modelSel"></select>
            <div class="tb-right">
                <button class="ib" id="wsBtn" onclick="toggleWS()" title="Web Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/></svg></button>
                <button class="ib" onclick="toggleSearch()" title="Search (Ctrl+F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
                <button class="ib" onclick="exportChat()" title="Export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
                <button class="ib" onclick="openSettings()" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            </div>
        </div>

        <div class="search-bar" id="sBar">
            <input type="text" id="sInput" placeholder="Search in conversation..." oninput="searchChat()">
            <span class="cnt" id="sCnt"></span>
            <button class="btn btn2" onclick="sNav(-1)">↑</button>
            <button class="btn btn2" onclick="sNav(1)">↓</button>
            <button class="btn btn2" onclick="toggleSearch()">✕</button>
        </div>

        <div class="chat" id="chatArea">
            <div class="welcome" id="welcome">
                <div class="w-icon">⚡</div>
                <h2>How can I help you?</h2>
                <p>Choose a model and start a conversation. I can help with coding, writing, analysis, and more.</p>
                <div class="qk">
                    <button class="qk-btn" onclick="qa('Explain quantum computing in simple terms')">Explain something</button>
                    <button class="qk-btn" onclick="qa('Write a Python function to sort a list')">Write code</button>
                    <button class="qk-btn" onclick="qa('What are the pros and cons of microservices?')">Compare ideas</button>
                    <button class="qk-btn" onclick="qa('Help me write a professional email')">Draft an email</button>
                </div>
            </div>
        </div>

        <button class="stop" id="stopBtn" onclick="stopGen()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg> Stop</button>

        <div class="sc-bar">
            <span><kbd>Ctrl+B</kbd> Sidebar</span>
            <span><kbd>Ctrl+N</kbd> New chat</span>
            <span><kbd>Ctrl+F</kbd> Search</span>
        </div>

        <div class="inp-wrap">
            <div class="fp" id="fp"></div>
            <div class="inp-box">
                <div class="inp-extras">
                    <button class="ib" onclick="document.getElementById('fi').click()" title="Upload image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
                    <input type="file" id="fi" accept="image/*" style="display:none" onchange="fileSel(event)">
                </div>
                <textarea id="inp" placeholder="Message Calyth..." rows="1"></textarea>
                <button class="send" id="sendBtn" onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
            </div>
            <div class="inp-hint">Enter to send · Shift+Enter for new line</div>
        </div>
    </div>

    <!-- Settings -->
    <div class="modal-bg" id="settModal">
        <div class="modal">
            <h3>Settings</h3>
            <div class="mf"><label>Backend URL</label><input id="srvIn" type="text" placeholder="https://calyth.onrender.com"></div>
            <div class="mf"><label>System Prompt</label><textarea id="sysIn" placeholder="You are a helpful assistant..."></textarea></div>
            <div class="m-acts">
                <button class="btn btn-d" onclick="clearAll()">Clear all</button>
                <button class="btn btn2" onclick="closeSett()">Cancel</button>
                <button class="btn btn1" onclick="saveSett()">Save</button>
            </div>
        </div>
    </div>

    <!-- Share -->
    <div class="modal-bg" id="shareModal">
        <div class="modal">
            <h3>Share Conversation</h3>
            <div id="shareContent"></div>
            <div class="m-acts"><button class="btn btn2" onclick="$('shareModal').classList.remove('on')">Close</button></div>
        </div>
    </div>

    <script>
    const $=id=>document.getElementById(id);
    const DEF='https://calyth.onrender.com';
    let srv=localStorage.getItem('c_srv')||DEF, sys=localStorage.getItem('c_sys')||'';
    let chats=JSON.parse(localStorage.getItem('c_chats')||'[]');
    let active=null, gen=false, abort=null, files=[], sIdx=-1;
    let light=localStorage.getItem('c_theme')==='light', wsOn=false;
    const MODELS=[
        {id:'openai/gpt-oss-20b',n:'GPT-OSS 20B',p:'groq'},{id:'openai/gpt-oss-120b',n:'GPT-OSS 120B',p:'groq'},
        {id:'qwen/qwen3.6-27b',n:'Qwen 3.6 27B',p:'groq'},{id:'groq/compound',n:'Groq Compound',p:'groq'},
        {id:'groq/compound-mini',n:'Compound Mini',p:'groq'},{id:'allam-2-7b',n:'Allam 2 7B',p:'groq'},
        {id:'gemini-1.5-flash',n:'Gemini Flash',p:'google'},{id:'gemini-1.5-pro',n:'Gemini Pro',p:'google'},
    ];
    let model=localStorage.getItem('c_model')||'openai/gpt-oss-20b';

    if(light)document.body.classList.add('light');

    // Init
    const sel=$('modelSel');
    MODELS.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.n+' · '+m.p;sel.appendChild(o)});
    sel.value=model;
    sel.onchange=()=>{model=sel.value;localStorage.setItem('c_model',model)};
    const inp=$('inp');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
    inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px'});
    $('srvIn').value=srv;$('sysIn').value=sys;
    renderList();connect();

    document.addEventListener('keydown',e=>{
        if(e.ctrlKey&&e.key==='b'){e.preventDefault();toggleSidebar()}
        if(e.ctrlKey&&e.key==='n'){e.preventDefault();newChat()}
        if(e.ctrlKey&&e.key==='f'){e.preventDefault();toggleSearch()}
        if(e.ctrlKey&&e.key===','){e.preventDefault();openSettings()}
        if(e.key==='Escape'){closeSett();$('shareModal').classList.remove('on')}
    });

    async function connect(){
        const d=$('sDot'),t=$('sTxt');d.className='dot';t.textContent='Connecting...';
        try{const r=await fetch(srv+'/health',{signal:AbortSignal.timeout(5000)});
        if(r.ok){d.className='dot ok';t.textContent=srv.replace(/https?:\/\//,'')}else throw 0}catch{d.className='dot err';t.textContent='Unreachable'}
    }

    async function chat(msg){
        abort=new AbortController();
        const ep=wsOn?'/search':'/chat';
        const r=await fetch(srv+ep,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({model,msg,system:sys||undefined}),signal:abort.signal});
        return await r.text();
    }

    function stopGen(){if(abort){abort.abort();abort=null}}

    function newChat(){active={id:Date.now(),title:'New chat',messages:[]};chats.unshift(active);save();renderList();renderMsgs();inp.focus()}
    function delChat(id,e){e?.stopPropagation();chats=chats.filter(c=>c.id!==id);if(active?.id===id)active=null;save();renderList();renderMsgs()}
    function save(){localStorage.setItem('c_chats',JSON.stringify(chats))}

    function renderList(){
        const c=$('chatList');c.innerHTML='';
        chats.forEach(ch=>{
            const d=document.createElement('div');d.className='chat-item'+(active?.id===ch.id?' active':'');
            d.innerHTML=`<span class="t">${esc(ch.title)}</span><div class="acts"><button class="act-btn" onclick="shareChat(${ch.id},event)" title="Share"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button><button class="act-btn del" onclick="delChat(${ch.id},event)" title="Delete"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>`;
            d.onclick=()=>{active=ch;renderList();renderMsgs()};
            c.appendChild(d);
        });
    }

    function renderMsgs(){
        const a=$('chatArea'),w=$('welcome');
        if(!active||!active.messages.length){a.innerHTML='';a.appendChild(w);w.style.display='';return}
        w.style.display='none';a.innerHTML='';
        active.messages.forEach((m,i)=>appendMsg(m.role,m.content,m.model,false,i));
        a.scrollTop=a.scrollHeight;
    }

    async function send(){
        const msg=inp.value.trim();
        if(!msg&&files.length===0||gen)return;
        inp.value='';inp.style.height='auto';
        if(!active)newChat();
        active.title=(msg||'Image').slice(0,40)+((msg||'').length>40?'...':'');renderList();
        const w=$('welcome');if(w)w.style.display='none';

        let content=msg;
        if(files.length>0){
            content=msg||'Analyze this image';
            appendMsg('user',content+' 📷',null,true);
            active.messages.push({role:'user',content,image:files[0].data});
            files=[];$('fp').innerHTML='';$('fp').classList.remove('on');
        }else{
            appendMsg('user',msg,null,true);
            active.messages.push({role:'user',content:msg});
        }

        const tid=showTyping();gen=true;$('sendBtn').disabled=true;$('stopBtn').classList.add('on');
        try{
            let reply;
            const last=active.messages[active.messages.length-1];
            if(last.image){
                const r=await fetch(srv+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({model,message:content,imageBase64:last.image}),signal:abort?.signal});
                reply=await r.text();
            }else reply=await chat(msg);
            removeTyping(tid);
            if(reply.startsWith('Error:')){appendMsg('error',reply,null,true);active.messages.push({role:'error',content:reply})}
            else{appendMsg('assistant',reply,model,true);active.messages.push({role:'assistant',content:reply,model})}
        }catch(e){removeTyping(tid);if(e.name!=='AbortError')appendMsg('error','Network error: '+e.message,null,true)}
        gen=false;$('sendBtn').disabled=false;$('stopBtn').classList.remove('on');abort=null;save();inp.focus();
    }

    function qa(q){inp.value=q;send()}
    function regen(idx){if(!active||gen)return;const um=active.messages.slice(0,idx+1).reverse().find(m=>m.role==='user');if(um){active.messages=active.messages.slice(0,idx);save();renderMsgs();inp.value=um.content;send()}}
    function editMsg(idx){const eb=document.querySelector(`[data-i="${idx}"] .edit-box`);if(eb){eb.classList.toggle('on');eb.querySelector('textarea').value=active.messages[idx].content}}
    function saveEdit(idx){const eb=document.querySelector(`[data-i="${idx}"] .edit-box`);const nc=eb.querySelector('textarea').value.trim();if(!nc)return;active.messages[idx]={...active.messages[idx],content:nc};active.messages=active.messages.slice(0,idx+1);save();renderMsgs();inp.value=nc;send()}
    function copyLast(){const la=[...active.messages].reverse().find(m=>m.role==='assistant');if(la)navigator.clipboard.writeText(la.content)}

    function toggleSearch(){$('sBar').classList.toggle('open');if($('sBar').classList.contains('open'))$('sInput').focus();else{$('sInput').value='';$('sCnt').textContent='';document.querySelectorAll('.sh').forEach(e=>e.classList.remove('sh'))}}
    function searchChat(){const q=$('sInput').value.toLowerCase();document.querySelectorAll('.sh').forEach(e=>e.classList.remove('sh'));if(!q||!active){$('sCnt').textContent='';return}let c=0;document.querySelectorAll('.mb').forEach(e=>{if(e.textContent.toLowerCase().includes(q)){e.classList.add('sh');c++}});sIdx=c>0?0:-1;$('sCnt').textContent=c?c+' found':'None'}
    function sNav(d){const ms=document.querySelectorAll('.sh');if(!ms.length)return;ms.forEach(m=>m.style.outline='none');sIdx=(sIdx+d+ms.length)%ms.length;ms[sIdx].style.outline='2px solid var(--accent)';ms[sIdx].scrollIntoView({behavior:'smooth',block:'center'})}

    async function shareChat(id,e){
        e?.stopPropagation();const ch=chats.find(c=>c.id===id);if(!ch)return;
        try{const r=await fetch(srv+'/share',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({id:'',title:ch.title,messages:ch.messages.map(m=>({role:m.role==='error'?'assistant':m.role,content:m.content})),createdAt:Date.now()})});
        const d=await r.json();const url=location.origin+'/shared/'+d.id+'/html';
        $('shareContent').innerHTML=`<p style="font-size:13px;color:var(--fg2);margin-bottom:10px">Share this link:</p><div class="share-link">${url}</div><button class="btn btn1" style="margin-top:10px" onclick="navigator.clipboard.writeText('${url}');this.textContent='Copied!'">Copy</button>`;
        $('shareModal').classList.add('on')}catch(e){alert('Failed: '+e.message)}
    }

    function appendMsg(role,content,model,animate,idx){
        const a=$('chatArea'),g=document.createElement('div');
        g.className='msg';g.dataset.i=idx??'';if(animate)g.style.animation='fadeUp .3s ease';
        const ac=role==='user'?'user':role==='error'?'err':'bot';
        const ai=role==='user'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>':role==='error'?'⚠':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
        const nm=role==='user'?'You':role==='error'?'Error':'Calyth';
        const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        let mt='';if(model){const p=MODELS.find(m=>m.id===model)?.p||'';mt=`<span class="mt ${p}">${model}</span>`}
        const acts=role!=='error'?`<div class="msg-acts"><button class="ma" onclick="cpMsg(this)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>${role==='assistant'&&idx!=undefined?`<button class="ma" onclick="regen(${idx})"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Retry</button>`:''}${role==='user'&&idx!=undefined?`<button class="ma" onclick="editMsg(${idx})"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit</button>`:''}</div>`:'';
        const eb=role==='user'?`<div class="edit-box"><textarea></textarea><div class="edit-acts"><button class="btn btn2" onclick="this.closest('.edit-box').classList.remove('on')">Cancel</button><button class="btn btn1" onclick="saveEdit(${idx})">Save & Resend</button></div></div>`:'';
        g.innerHTML=`<div class="av ${ac}">${ai}</div><div class="mc"><div class="mh"><span class="mn">${nm}</span>${mt}<span class="mtime">${t}</span></div><div class="mb">${fmt(content)}</div>${acts}${eb}</div>`;
        a.appendChild(g);a.scrollTop=a.scrollHeight;
    }

    function showTyping(){const a=$('chatArea'),g=document.createElement('div');g.className='msg';g.id='tp-'+Date.now();g.innerHTML='<div class="av bot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><div class="mc"><div class="mh"><span class="mn">Calyth</span></div><div class="dots"><span></span><span></span><span></span></div></div>';a.appendChild(g);a.scrollTop=a.scrollHeight;return g.id}
    function removeTyping(id){$(id)?.remove()}

    function fmt(t){
        t=t.replace(/\r\n/g,'\n');
        const cbs=[];t=t.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{const i=cbs.length;cbs.push(`<div class="code-hdr"><span>${l||'code'}</span><button class="cp-btn" onclick="cpCode(this)">Copy</button></div><pre><code>${esc(c.trim())}</code></pre>`);return`%%CB${i}%%`});
        t=t.replace(/(?:^|\n)((?:\|.+\|?\n)+)/g,m=>{const rs=m.trim().split('\n').filter(r=>r.trim());if(rs.length<2||!rs[1].match(/^\|[\s\-:|]+\|$/))return m;let h='<table>';rs.forEach((r,i)=>{if(i===1)return;const cs=r.split('|').filter((_,j,a)=>j>0&&j<a.length-1);h+='<tr>'+cs.map(c=>`<${i===0?'th':'td'}>${c.trim()}</${i===0?'th':'td'}>`).join('')+'</tr>'});return'\n'+h+'</table>'});
        const ls=t.split('\n');let html='';let inL=false,lt='';
        for(let i=0;i<ls.length;i++){
            let l=ls[i];
            if(l.match(/%%CB(\d+)%%/)){if(inL)html+=lt==='ul'?'</ul>':'</ol>';html+=cbs[+RegExp.$1];continue}
            if(l.match(/^#### (.+)/)){html+=`<h4>${il(RegExp.$1)}</h4>`;continue}
            if(l.match(/^### (.+)/)){html+=`<h3>${il(RegExp.$1)}</h3>`;continue}
            if(l.match(/^## (.+)/)){html+=`<h2>${il(RegExp.$1)}</h2>`;continue}
            if(l.match(/^# (.+)/)){html+=`<h1>${il(RegExp.$1)}</h1>`;continue}
            if(l.match(/^(-{3,}|\*{3,}|_{3,})$/)){html+='<hr>';continue}
            if(l.match(/^> (.+)/)){html+=`<blockquote>${il(RegExp.$1)}</blockquote>`;continue}
            if(l.match(/^[\s]*[-*+] (.+)/)){if(!inL||lt!=='ul'){if(inL)html+=lt==='ul'?'</ul>':'</ol>';html+='<ul>';inL=true;lt='ul'}html+=`<li>${il(RegExp.$1)}</li>`;continue}
            if(l.match(/^[\s]*\d+\. (.+)/)){if(!inL||lt!=='ol'){if(inL)html+=lt==='ul'?'</ul>':'</ol>';html+='<ol>';inL=true;lt='ol'}html+=`<li>${il(RegExp.$1)}</li>`;continue}
            if(inL&&l.trim()){html+=lt==='ul'?'</ul>':'</ol>';inL=false}
            if(!l.trim()){html+='<br>';continue}
            html+=`<p>${il(l)}</p>`;
        }
        if(inL)html+=lt==='ul'?'</ul>':'</ol>';
        return html;
    }
    function il(t){return t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

    function cpCode(b){navigator.clipboard.writeText(b.closest('.code-hdr').nextElementSibling.querySelector('code').textContent);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500)}
    function cpMsg(b){const t=b.closest('.mc').querySelector('.mb');navigator.clipboard.writeText(t.textContent);b.innerHTML='✓ Copied';setTimeout(()=>b.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy',1200)}
    function toggleSidebar(){const s=$('sidebar');window.innerWidth<=768?s.classList.toggle('open'):s.classList.toggle('collapsed')}
    function openSettings(){$('settModal').classList.add('on')}
    function closeSett(){$('settModal').classList.remove('on')}
    function saveSett(){srv=$('srvIn').value.trim().replace(/\/$/,'')||DEF;sys=$('sysIn').value.trim();localStorage.setItem('c_srv',srv);localStorage.setItem('c_sys',sys);closeSett();connect()}
    function clearAll(){if(!confirm('Delete all?'))return;chats=[];active=null;localStorage.removeItem('c_chats');save();renderList();renderMsgs();closeSett()}
    function exportChat(){if(!active)return;const t=active.messages.map(m=>`**${m.role==='user'?'You':'Calyth'}**:\n${m.content}`).join('\n\n');const b=new Blob([t],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='calyth-'+Date.now()+'.md';a.click()}
    function toggleWS(){wsOn=!wsOn;$('wsBtn').classList.toggle('on',wsOn)}

    function fileSel(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{files.push({name:f.name,data:ev.target.result.split(',')[1],preview:ev.target.result});renderFP()};r.readAsDataURL(f);e.target.value=''}
    function renderFP(){const c=$('fp');c.innerHTML='';c.classList.toggle('on',files.length>0);files.forEach((f,i)=>{const t=document.createElement('div');t.className='ft';t.innerHTML=`<img src="${f.preview}"><button class="x" onclick="rmFile(${i})">✕</button>`;c.appendChild(t)})}
    function rmFile(i){files.splice(i,1);renderFP()}
    </script>
</body>
</html>
