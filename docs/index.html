<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calyth — AI Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

        header { background: #1a1a2e; padding: 16px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #2a2a3e; flex-wrap: wrap; }
        header h1 { font-size: 20px; font-weight: 600; color: #fff; }
        header .subtitle { font-size: 13px; color: #888; }

        .model-selector { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .model-selector label { font-size: 13px; color: #aaa; }
        .model-selector select {
            background: #16213e; color: #e0e0e0; border: 1px solid #2a2a3e;
            padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
            outline: none; min-width: 200px;
        }
        .model-selector select:focus { border-color: #4a6fa5; }

        .server-bar { padding: 8px 24px; background: #12122a; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1a1a2e; }
        .server-bar input {
            flex: 1; background: #16213e; color: #e0e0e0; border: 1px solid #2a2a3e;
            padding: 6px 10px; border-radius: 6px; font-size: 12px; outline: none;
        }
        .server-bar input:focus { border-color: #4a6fa5; }
        .server-bar button {
            background: #4a6fa5; color: #fff; border: none; padding: 6px 12px;
            border-radius: 6px; font-size: 12px; cursor: pointer;
        }
        .server-bar .status { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .status-ok { background: #1a3a1a; color: #86efac; }
        .status-err { background: #3b1a1a; color: #fca5a5; }
        .status-pending { background: #3b3b1a; color: #fde68a; }

        .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #1a365d; color: #e2e8f0; border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; }
        .message.error { align-self: flex-start; background: #3b1a1a; color: #fca5a5; border-bottom-left-radius: 4px; }

        .message pre { background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
        .message code { font-family: 'SF Mono', 'Fira Code', monospace; }
        .message p { margin: 4px 0; }

        .input-area { padding: 16px 24px; background: #1a1a2e; border-top: 1px solid #2a2a3e; display: flex; gap: 12px; align-items: flex-end; }
        .input-area textarea {
            flex: 1; background: #16213e; color: #e0e0e0; border: 1px solid #2a2a3e;
            padding: 12px; border-radius: 10px; font-size: 14px; resize: none;
            font-family: inherit; outline: none; max-height: 120px; line-height: 1.4;
        }
        .input-area textarea:focus { border-color: #4a6fa5; }
        .input-area button {
            background: #4a6fa5; color: #fff; border: none; padding: 12px 20px;
            border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 500;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #3b5998; }
        .input-area button:disabled { background: #2a2a3e; cursor: not-allowed; }

        .model-badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; font-weight: 500; }
        .badge-groq { background: #1e3a5f; color: #7dd3fc; }
        .badge-google { background: #1a3a1a; color: #86efac; }

        .welcome { text-align: center; margin: auto; color: #555; }
        .welcome h2 { font-size: 28px; margin-bottom: 8px; color: #888; }
        .welcome p { font-size: 14px; color: #555; }

        .typing { display: inline-flex; gap: 4px; padding: 8px 16px; }
        .typing span { width: 6px; height: 6px; background: #4a6fa5; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        @media (max-width: 600px) {
            header { padding: 12px 16px; }
            .model-selector { margin-left: 0; width: 100%; }
            .chat-container { padding: 16px; }
            .input-area { padding: 12px 16px; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Calyth</h1>
            <span class="subtitle">AI-Powered Assistant</span>
        </div>
        <div class="model-selector">
            <label for="model">Model:</label>
            <select id="model"></select>
        </div>
    </header>

    <div class="server-bar">
        <input id="serverUrl" type="text" placeholder="Backend URL (e.g. https://calyth.onrender.com)" />
        <button onclick="connect()">Connect</button>
        <span id="status" class="status status-pending">disconnected</span>
    </div>

    <div class="chat-container" id="chat">
        <div class="welcome">
            <h2>How can I help you?</h2>
            <p>Set your backend URL above, choose a model, and start chatting.</p>
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send" onclick="send()">Send</button>
    </div>

    <script>
        let selectedModel = 'openai/gpt-oss-20b';
        let serverUrl = localStorage.getItem('calyth_server') || '';

        const models = [
            { id: 'openai/gpt-oss-20b', name: 'GPT-OSS 20B', provider: 'groq' },
            { id: 'openai/gpt-oss-120b', name: 'GPT-OSS 120B', provider: 'groq' },
            { id: 'qwen/qwen3.6-27b', name: 'Qwen 3.6 27B', provider: 'groq' },
            { id: 'groq/compound', name: 'Groq Compound', provider: 'groq' },
            { id: 'groq/compound-mini', name: 'Groq Compound Mini', provider: 'groq' },
            { id: 'allam-2-7b', name: 'Allam 2 7B', provider: 'groq' },
            { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash', provider: 'google' },
            { id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro', provider: 'google' },
        ];

        const select = document.getElementById('model');
        models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = `${m.name} (${m.provider})`;
            select.appendChild(opt);
        });
        select.value = selectedModel;
        select.onchange = () => { selectedModel = select.value; };

        const serverInput = document.getElementById('serverUrl');
        if (serverUrl) serverInput.value = serverUrl;

        const input = document.getElementById('input');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        async function connect() {
            serverUrl = serverInput.value.trim().replace(/\/$/, '');
            localStorage.setItem('calyth_server', serverUrl);
            const status = document.getElementById('status');
            status.className = 'status status-pending';
            status.textContent = 'connecting...';

            try {
                const res = await fetch(`${serverUrl}/health`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) {
                    status.className = 'status status-ok';
                    status.textContent = 'connected';
                    // Fetch models from server
                    const modelsRes = await fetch(`${serverUrl}/models`);
                    if (modelsRes.ok) {
                        const serverModels = await modelsRes.json();
                        select.innerHTML = '';
                        serverModels.forEach(m => {
                            const opt = document.createElement('option');
                            opt.value = m.id;
                            opt.textContent = `${m.name} (${m.provider})`;
                            select.appendChild(opt);
                        });
                        selectedModel = serverModels[0]?.id || 'openai/gpt-oss-20b';
                        select.value = selectedModel;
                    }
                } else {
                    status.className = 'status status-err';
                    status.textContent = 'error';
                }
            } catch (e) {
                status.className = 'status status-err';
                status.textContent = 'unreachable';
            }
        }

        function addMessage(role, content, model) {
            const chat = document.getElementById('chat');
            const welcome = chat.querySelector('.welcome');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;

            if (role === 'assistant' && model) {
                const provider = models.find(m => m.id === model)?.provider || '';
                const badgeClass = provider === 'groq' ? 'badge-groq' : 'badge-google';
                div.innerHTML = `<span class="model-badge ${badgeClass}">${model}</span><div>${formatText(content)}</div>`;
            } else {
                div.innerHTML = `<div>${formatText(content)}</div>`;
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function formatText(text) {
            return text
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        async function send() {
            const msg = input.value.trim();
            if (!msg || !serverUrl) return;

            input.value = '';
            input.style.height = 'auto';
            document.getElementById('send').disabled = true;

            addMessage('user', msg);

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            document.getElementById('chat').appendChild(typingDiv);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;

            try {
                const res = await fetch(`${serverUrl}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: selectedModel, message: msg })
                });
                const reply = await res.text();
                typingDiv.remove();

                if (reply.startsWith('Error:')) {
                    addMessage('error', reply);
                } else {
                    addMessage('assistant', reply, selectedModel);
                }
            } catch (err) {
                typingDiv.remove();
                addMessage('error', 'Network error: ' + err.message);
            }

            document.getElementById('send').disabled = false;
            input.focus();
        }

        // Auto-connect if URL saved
        if (serverUrl) connect();
    </script>
</body>
</html>
